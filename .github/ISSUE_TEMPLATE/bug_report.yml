name: Bug Report 🐛
description: Create a report to help us improve GhostBase
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: db-type
    attributes:
      label: Database Type
      options:
        - SQLite
        - PostgreSQL
        - MySQL
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Launch GhostBase with '...'
        2. Execute query '...'
        3. Press shortcut / click button '...'
        4. See error or unexpected output
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. Python 3.11.4"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error Traceback / Logs
      description: Please copy and paste any terminal error traceback if available.
      render: shell
    validations:
      required: false
